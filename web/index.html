<!doctype html><html lang="zh-CN"><head><link rel="icon" type="image/svg+xml" href="/center/icon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeepSeek Harness</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f7f8fa;color:#18202e}header{height:54px;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e2e5ea;background:white}header strong{white-space:nowrap}select,button,input{font:inherit;border:1px solid #d8dce3;border-radius:8px;padding:8px;background:white}button{cursor:pointer}select{max-width:36vw}#status{color:#667085;font-size:12px;flex:1}html,body{height:100%;overflow:hidden}main{height:100dvh}iframe{border:0;width:100%;height:100%;background:white}.card{max-width:440px;margin:12vh auto;padding:28px;background:white;border:1px solid #e2e5ea;border-radius:16px}.card input{width:100%;margin:12px 0}.primary{background:#365de8;color:white;border:0}p{line-height:1.7;color:#667085}dialog{border:1px solid #e2e5ea;border-radius:14px;max-width:94vw;width:560px}dialog::backdrop{background:#0005}code{overflow-wrap:anywhere}#error{color:#ba3030}#empty{text-align:center;padding:18vh 20px;color:#667085}.device{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}[hidden]{display:none!important}@media(max-width:600px){header{gap:6px;padding:8px}header strong{font-size:12px}#status{font-size:11px}button,select{padding:7px}.card{margin:12vh 16px}}
#deviceDock{position:fixed;left:240px;bottom:10px;width:26px;height:26px;padding:0;z-index:20;background:#f7f8fa;color:#596579;font-size:16px;line-height:1;display:grid;place-items:center}#deviceMenu{position:fixed;left:12px;bottom:52px;width:260px;max-width:calc(100vw - 24px);max-height:65vh;overflow:auto;z-index:21;background:white;border:1px solid #e2e5ea;border-radius:12px;padding:6px;box-shadow:0 8px 28px #0002}#deviceMenu button{display:block;width:100%;border:0;text-align:left;background:transparent;padding:10px}#deviceMenu button:hover{background:#f1f4fa}#settings{border-bottom:1px solid #eee!important}#settingsActions{display:flex;gap:8px;margin-bottom:16px}@media(max-width:600px){#deviceDock{left:auto;right:12px;top:auto;bottom:150px}#deviceMenu{left:auto;right:12px;bottom:190px}} #connectionNotice{position:fixed;top:10px;left:50%;transform:translateX(-50%);max-width:90vw;padding:8px 14px;border:1px solid #e5d2a0;border-radius:8px;background:#fff8e8;color:#775820;z-index:30;font-size:12px;pointer-events:none}</style></head><body><header hidden><strong>DSH 设备中心</strong><select id="devices" aria-label="选择电脑" hidden></select><span id="status"></span><button id="reload" hidden>重新连接</button><button id="manage" hidden>设备</button><button id="logout" hidden>退出</button></header><button id="deviceDock" title="设备中心" aria-label="设备中心" hidden>⇄</button><nav id="deviceMenu" hidden><button id="settings">⚙ 设置</button><div id="menuDevices"></div><div id="deviceFeedback" role="status" hidden style="padding:4px 10px;color:#667085"></div></nav><div id="connectionNotice" role="status" hidden></div><main><form id="login" class="card"><h2>连接你的电脑</h2><p>会话和文件留在各自电脑，随时切换。</p><input id="password" type="password" autocomplete="current-password" placeholder="中心密码" required><button class="primary">登录</button><p id="error"></p></form><div id="empty" hidden>点击左下角图标，选择一台在线电脑</div><iframe id="view" title="当前电脑的 DSH" allow="clipboard-read; clipboard-write; microphone 'src'" hidden></iframe></main><dialog id="dialog"><h2>设备中心设置</h2><p id="settingsStatus"></p><div id="settingsActions"></div><div id="deviceList"></div><p>在电脑上安装独立插件 <b>dsh-center-host</b>，使用配对码加入。配对码十分钟内有效，只可使用一次。</p><button id="pair">生成配对码</button><p><code id="code"></code></p><button id="close">关闭</button></dialog><script src="/center/app.js"></script></body></html>
