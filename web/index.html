<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DSH · 我的设备</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f7f8fa;color:#18202e}header{height:54px;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e2e5ea;background:white}header strong{white-space:nowrap}select,button,input{font:inherit;border:1px solid #d8dce3;border-radius:8px;padding:8px;background:white}button{cursor:pointer}select{max-width:36vw}#status{color:#667085;font-size:12px;flex:1}main{height:calc(100dvh - 54px)}iframe{border:0;width:100%;height:100%;background:white}.card{max-width:440px;margin:12vh auto;padding:28px;background:white;border:1px solid #e2e5ea;border-radius:16px}.card input{width:100%;margin:12px 0}.primary{background:#365de8;color:white;border:0}p{line-height:1.7;color:#667085}dialog{border:1px solid #e2e5ea;border-radius:14px;max-width:94vw;width:560px}dialog::backdrop{background:#0005}code{overflow-wrap:anywhere}#error{color:#ba3030}#empty{text-align:center;padding:18vh 20px;color:#667085}.device{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}[hidden]{display:none!important}@media(max-width:600px){header{gap:6px;padding:8px}header strong{font-size:12px}#status{font-size:11px}button,select{padding:7px}.card{margin:12vh 16px}}
</style></head><body><header><strong>DSH 设备中心</strong><select id="devices" aria-label="选择电脑" hidden></select><span id="status"></span><button id="reload" hidden>重新连接</button><button id="manage" hidden>设备</button><button id="logout" hidden>退出</button></header><main><form id="login" class="card"><h2>连接你的电脑</h2><p>会话和文件留在各自电脑，随时切换。</p><input id="password" type="password" autocomplete="current-password" placeholder="中心密码" required><button class="primary">登录</button><p id="error"></p></form><div id="empty" hidden>选择一台在线电脑开始</div><iframe id="view" title="当前电脑的 DSH" allow="clipboard-read; clipboard-write" hidden></iframe></main><dialog id="dialog"><h2>我的设备</h2><div id="deviceList"></div><p>在电脑上安装独立插件 <b>dsh-center-host</b>，使用配对码加入。配对码十分钟内有效，只可使用一次。</p><button id="pair">生成配对码</button><p><code id="code"></code></p><button id="close">关闭</button></dialog><script src="/center/app.js"></script></body></html>
